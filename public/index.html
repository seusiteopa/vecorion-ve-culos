<style>
:root{--bg:#f6f5f2;--s:#fff;--ink:#16181c;--mu:#5b616b;--ln:#e3e1dc;--r:14px;--a:#1f5fbf;--as:#1f5fbf;--on:#fff;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#101214;--s:#181b1f;--ink:#f2f1ee;--mu:#a3a9b2;--ln:#2a2e34}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit}h1,h2,h3{line-height:1.15;letter-spacing:-.01em;margin:0}h1{font-size:clamp(26px,5vw,40px)}h2{font-size:clamp(20px,3vw,26px)}h3{font-size:17px}
.c{max-width:1200px;margin:auto;padding:0 16px}.mu{color:var(--mu)}.tc{text-align:center}.full{grid-column:1/-1}
.sp,.tag{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}.ic.f{fill:currentColor}

.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}.lg{font-weight:800;text-decoration:none;font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lg img{display:block;height:32px;width:auto}
nav{display:flex;align-items:center;gap:16px}nav{flex:none}nav a{text-decoration:none;font-weight:600;white-space:nowrap}
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:var(--r);border:1px solid var(--ln);background:var(--s);color:var(--ink);font-weight:600;font-size:16px;font-family:inherit;text-decoration:none;cursor:pointer}
.b.p{background:var(--a);color:var(--on);border-color:var(--a)}.b.g{background:#0f7f43;color:#fff;border-color:#0f7f43}nav .b{min-height:40px;padding:0 14px}
.hero{background:var(--a);color:var(--on);padding:32px 0 0}.hero .lead{margin:8px 0 20px;max-width:560px;font-size:18px}
.rule{height:12px;margin-top:28px;background:repeating-linear-gradient(90deg,currentColor 0 1px,transparent 1px 8px);opacity:.35}
.pn{background:var(--s);color:var(--ink);border-radius:var(--r);padding:16px;display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media(min-width:960px){.pn{grid-template-columns:repeat(4,1fr)}}
label{display:grid;gap:4px;font-size:14px;font-weight:600}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--ln);border-radius:var(--r);background:var(--s);color:var(--ink);font:inherit}
section{display:block}.sc{padding-top:32px;padding-bottom:32px}.sc>.c>h2{margin-bottom:16px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}@media(min-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}@media(min-width:960px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;background:var(--s);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden}
.im{display:block;position:relative;aspect-ratio:4/3;background:var(--bg);overflow:hidden}.im img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}.card:hover .im img{transform:scale(1.03)}
.np{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;height:100%;color:var(--mu);font-size:14px}.np svg{width:60%;max-width:200px;height:auto;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}.hub{fill:var(--a);stroke:none}.np.big{aspect-ratio:4/3;background:var(--s);border-radius:var(--r)}
.tag{position:absolute;left:12px;bottom:12px;background:var(--a);color:var(--on);font-weight:700;padding:6px 14px 6px 12px;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.tag.lg2{position:static;display:inline-block;font-size:26px;padding:10px 22px 10px 18px;margin:12px 0}
.sl{position:absolute;top:12px;left:12px;background:var(--s);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.sold .im img{filter:grayscale(1)}
.fv{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:50%;border:0;background:var(--s);color:var(--ink);display:grid;place-items:center;cursor:pointer}.fv[aria-pressed=true]{color:var(--as)}
.inf{display:block;padding:12px 14px 14px;text-decoration:none}.inf p{margin:4px 0 0;font-size:13px}
.em{background:var(--s);border:1px solid var(--ln);border-radius:var(--r);padding:24px;display:grid;gap:12px;justify-items:start}
.fl{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin:16px 0}@media(min-width:960px){.fl{grid-template-columns:repeat(4,1fr)}}.fl label:first-child{grid-column:1/-1}
.ficha{display:grid;gap:24px;padding-bottom:88px}.ga,.ds,.side{min-width:0}@media(min-width:960px){.ficha{grid-template-columns:7fr 5fr;padding-bottom:32px}.ga{grid-column:1;grid-row:1}.ds{grid-column:1;grid-row:2}.side{grid-column:2;grid-row:1/span 2;position:sticky;top:80px;align-self:start}}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:var(--r)}.gal img{flex:0 0 100%;width:100%;height:auto;scroll-snap-align:center;aspect-ratio:4/3;object-fit:cover}
.fc{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden;margin:12px 0}.fc div{background:var(--s);padding:12px}
.fc small{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}.fc b{font-family:ui-monospace,Menlo,Consolas,monospace}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0;list-style:none}.chips li{background:var(--s);border:1px solid var(--ln);border-radius:999px;padding:4px 12px;font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--s);border-top:1px solid var(--ln)}@media(min-width:960px){.bar{display:none}}
footer{border-top:1px solid var(--ln);padding:24px 0;margin-top:32px;font-size:14px}
.nar,.fm{display:grid;gap:16px;max-width:640px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{min-height:44px;padding:0 16px;border:1px solid var(--ln);border-radius:var(--r);background:var(--s);color:var(--ink);font-weight:600;font-size:16px;font-family:inherit;cursor:pointer}.tabs [aria-current=true]{background:var(--a);color:var(--on);border-color:var(--a)}
.tb{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding-top:16px}.lk{background:none;border:0;color:inherit;text-decoration:underline;font:inherit;cursor:pointer}
.row{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;background:var(--s);border:1px solid var(--ln);border-radius:var(--r);padding:12px;margin-bottom:12px}.row img{width:64px;height:48px;object-fit:cover;border-radius:8px;background:var(--bg)}
.ac{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}.ac button,.pt button{min-height:36px;padding:0 12px;border:1px solid var(--ln);border-radius:var(--r);background:var(--s);color:var(--ink);font:inherit;cursor:pointer}
.pt{display:flex;gap:12px;flex-wrap:wrap}.pt div{width:96px;display:grid;gap:4px}.pt img{width:96px;height:72px;object-fit:cover;border-radius:8px}.pt .x{display:flex;gap:2px}.pt .x button{padding:0;flex:1}
#t{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:var(--r);z-index:70;max-width:90vw}#t[hidden]{display:none}
.skip{position:absolute;left:8px;top:-60px;z-index:80;background:var(--s);color:var(--ink);padding:10px 14px;border-radius:var(--r)}.skip:focus{top:8px}
.sk{height:220px;background:var(--ln);border-radius:var(--r);opacity:.6}
@media(max-width:599px){nav .b span{display:none}nav{gap:12px}nav a{font-size:15px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></symbol>
<symbol id="i-hf" viewBox="0 0 24 24"><path fill="currentColor" d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></symbol>
<symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/></symbol>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 20l1.3-4.2A8 8 0 1 1 8.4 18.8L4 20z"/><path d="M9.2 8.8c.2 2.6 2.4 4.8 5 5l1.1-1.2-1.9-1-.9.7a3.3 3.3 0 0 1-1.6-1.6l.7-.9-1-1.9-1.4 1z"/></symbol>
<symbol id="i-phone" viewBox="0 0 24 24"><path d="M6.6 4h2.6l1.4 3.6-1.7 1.2a11 11 0 0 0 5.3 5.3l1.2-1.7 3.6 1.4v2.6a1.6 1.6 0 0 1-1.7 1.6C10.6 17.6 6.4 13.4 5 5.7A1.6 1.6 0 0 1 6.6 4z"/></symbol>
<symbol id="car" viewBox="0 0 160 80"><path d="M6 58v-9q0-5 5-6l22-5q9-12 23-13h32q13 1 22 12l26 4q9 2 9 8v9h-10a12 12 0 0 0-24 0H60a12 12 0 0 0-24 0z"/><path d="M42 39q7-9 20-9h20q10 1 17 9zM78 30v9"/><circle cx="48" cy="58" r="8"/><circle cx="128" cy="58" r="8"/><circle class="hub" cx="48" cy="58" r="2.6"/><circle class="hub" cx="128" cy="58" r="2.6"/></symbol>
</defs></svg>
<div id="app"></div><div id="t" role="status" aria-live="polite" hidden></div>
<noscript>Este site precisa de JavaScript para funcionar.</noscript>
<script>
const DEF={name:'Nome da sua loja',tagline:'Escreva aqui a frase da sua loja.',accent:'#1F5FBF',corners:'suave',categories:['Hatch','Sedã','SUV','Picape','Utilitário','Esportivo','Outros'],differentials:[]};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const ls={g(k){try{return localStorage.getItem(k)}catch{return null}},s(k,v){try{localStorage.setItem(k,v)}catch{}}};
const S={cfg:DEF,v:[],st:'load',fav:JSON.parse(ls.g('fav')||'[]'),tk:null,lim:12,adm:null,tab:'v',ed:null,ph:[]};
try{S.tk=sessionStorage.getItem('tk')}catch{}
const Y={},act={},forms={};let T,TT;
const fm=n=>n>0?'R$ '+n.toLocaleString('pt-BR'):'Consulte o valor',km=n=>n.toLocaleString('pt-BR')+' km';
const nm=v=>[v.brand,v.model,v.version].filter(Boolean).join(' ');
const ph=(v,i=0,s='t')=>v.photos[i]?`/api/photo/${v.id}/${v.photos[i].id}/${s}`:'';
const np=()=>'<svg viewBox="0 0 160 80" aria-hidden="true"><use href="#car"/></svg>Sem foto';const pub=()=>S.v.filter(v=>v.status==='published'),ic=n=>`<svg class="ic"><use href="#i-${n}"/></svg>`;
const rec=a=>[...a].sort((x,y)=>y.createdAt.localeCompare(x.createdAt));
function toast(m){const t=$('#t');t.textContent=m;t.hidden=false;clearTimeout(TT);TT=setTimeout(()=>t.hidden=true,4000)}
/* tema: cor de destaque -> variantes com contraste */
const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),hex=a=>'#'+a.map(x=>Math.round(x).toString(16).padStart(2,'0')).join('');
const lum=h=>{const[r,g,b]=rgb(h).map(x=>{x/=255;return x<=.03928?x/12.92:((x+.055)/1.055)**2.4});return .2126*r+.7152*g+.0722*b};
function theme(){const a=/^#[0-9a-f]{6}$/i.test(S.cfg.accent)?S.cfg.accent:DEF.accent,st=document.documentElement.style;let s=a;
 for(let i=0;i<8&&1.05/(lum(s)+.05)<4.5;i++)s=hex(rgb(s).map(x=>x*.85));
 st.setProperty('--a',a);st.setProperty('--as',s);st.setProperty('--on',lum(a)>.4?'#111':'#fff');st.setProperty('--r',S.cfg.corners==='reto'?'4px':'14px')}
/* api */
async function api(p,o={}){const r=await fetch('/api/'+p,{method:o.method,headers:{...(o.json?{'content-type':'application/json'}:{}),...(S.tk?{authorization:'Bearer '+S.tk}:{}),...o.headers},body:o.json?JSON.stringify(o.json):o.body}).catch(()=>null);
 if(!r)throw{m:'Não foi possível conectar. Verifique sua internet.'};const d=await r.json().catch(()=>({}));
 if(!r.ok){if(r.status===401&&S.tk){S.tk=null;S.adm=null;try{sessionStorage.removeItem('tk')}catch{}draw()}throw{s:r.status,m:d.error?.message||'Algo deu errado do nosso lado. Tente novamente em instantes.'}}return d.data}
/* roteador */
function go(u){Y[location.href]=scrollY;history.pushState(null,'',u);draw();scrollTo(0,0)}
addEventListener('popstate',()=>{draw();scrollTo(0,Y[location.href]||0)});
document.addEventListener('click',e=>{const a=e.target.closest('a[data-l]');if(a&&!e.metaKey&&!e.ctrlKey&&!e.shiftKey){e.preventDefault();go(a.getAttribute('href'));return}const b=e.target.closest('[data-a]');if(b)act[b.dataset.a]?.(b,e)});
document.addEventListener('submit',async e=>{const f=e.target,k=f.dataset.f;if(!k)return;e.preventDefault();try{await forms[k](f,e)}catch(x){toast(x.m||'Algo deu errado do nosso lado. Tente novamente em instantes.');if(x.s===409){S.adm=null;S.ed=null;draw()}}});
/* filtros */
const F={q:'',marca:'',cat:'',preco:'',ano:'',comb:'',cam:'',ord:''},Qs=()=>({...F,...Object.fromEntries(new URLSearchParams(location.search))});
function flt(q){const o={pa:(a,b)=>a.price-b.price,pd:(a,b)=>b.price-a.price,km:(a,b)=>a.mileage-b.mileage,ano:(a,b)=>b.yearModel-a.yearModel}[q.ord]||((a,b)=>b.createdAt.localeCompare(a.createdAt));
 return pub().filter(v=>(!q.q||(nm(v)+' '+v.yearModel).toLowerCase().includes(q.q.toLowerCase()))&&(!q.marca||v.brand===q.marca)&&(!q.cat||v.category===q.cat)&&(!q.preco||v.price<=+q.preco)&&(!q.ano||v.yearModel>=+q.ano)&&(!q.comb||v.fuel===q.comb)&&(!q.cam||v.transmission===q.cam)).sort(o)}
const uq=k=>[...new Set(pub().map(v=>v[k]).filter(Boolean))].sort(),anos=()=>[...new Set(pub().map(v=>v.yearModel))].sort((a,b)=>b-a);
const precos=()=>{const m=Math.min(...pub().map(v=>v.price||1e9));return[3e4,5e4,7e4,1e5,15e4,2e5,3e5].filter(x=>x>=m).map(x=>[x,'Até '+fm(x)])};
const sel=(n,l,o,v,all='Todos')=>`<label>${l}<select data-flt="${n}"><option value="">${all}</option>${o.map(x=>{const[a,b]=Array.isArray(x)?x:[x,x];return`<option value="${esc(a)}"${String(a)===String(v)?' selected':''}>${esc(b)}</option>`}).join('')}</select></label>`;
const cnt=n=>n?`Ver ${n} ${n==1?'veículo':'veículos'} →`:'Limpar filtros';
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.flt;if(!k)return;
 if(location.pathname==='/estoque'){const u=new URLSearchParams(location.search);t.value?u.set(k,t.value):u.delete(k);history.replaceState(null,'','/estoque'+(u+''?'?'+u:''));S.lim=12;clearTimeout(T);T=setTimeout(res,150)}
 else if(t.closest('[data-f=hq]')){const q=Object.fromEntries($$('[data-f=hq] [data-flt]').map(x=>[x.dataset.flt,x.value]));$('#hc').textContent=cnt(flt(q).length)}});
forms.x=()=>{};forms.hq=f=>{const u=new URLSearchParams();$$('select',f).forEach(x=>x.value&&u.set(x.dataset.flt,x.value));go('/estoque'+(u+''?'?'+u:''))};
/* componentes */
function card(v,i=9){const f=S.fav.includes(v.id),n=new Date()-new Date(v.createdAt)<12096e5,t=v.status==='sold'?'Vendido':v.featured?'Destaque':n?'Recém-chegado':'';
 return`<article class="card${v.status==='sold'?' sold':''}"><a class="im" data-l href="/veiculo/${v.slug}" tabindex="-1" aria-hidden="true">${v.photos[0]?`<img src="${ph(v)}" alt="${esc(v.brand+' '+v.model+' '+v.yearModel)}, foto 1" width="640" height="480" ${i<2?'fetchpriority="high"':'loading="lazy"'} decoding="async">`:`<div class="np">${np()}</div>`}${t?`<span class="sl">${t}</span>`:''}<span class="tag">${esc(fm(v.price))}</span></a><button class="fv" data-a="fav" data-id="${v.id}" aria-pressed="${f}" aria-label="${f?'Remover '+esc(v.model)+' dos favoritos':'Favoritar '+esc(v.model)}">${ic(f?'hf':'heart')}</button><a class="inf" data-l href="/veiculo/${v.slug}"><small class="mu">${esc(v.brand)}</small><h3>${esc((v.model+' '+v.version).trim())}</h3><p class="sp mu">${v.yearModel} · ${km(v.mileage)} · ${esc(v.transmission)} · ${esc(v.fuel)}</p></a></article>`}
const grid=a=>`<div class="grid">${a.map(card).join('')}</div>`;
const wa=(c,t='')=>`https://wa.me/${c.whatsapp}${t?'?text='+encodeURIComponent(t):''}`;
function head(){const c=S.cfg;return`<header><div class="c hd"><a data-l href="/" class="lg">${c.logo?`<img src="/api/photo/s/logo/f?v=${c.logo}" alt="${esc(c.name)}">`:esc(c.name)}</a><nav aria-label="Principal"><a data-l href="/estoque">Estoque</a><a data-l href="/favoritos">Favoritos${S.fav.length?` (${S.fav.length})`:''}</a>${c.whatsapp?`<a class="b g" href="${wa(c)}" target="_blank" rel="noopener" aria-label="Falar no WhatsApp">${ic('chat')}<span>WhatsApp</span></a>`:''}</nav></div></header>`}
function foot(){const c=S.cfg;return`<footer><div class="c"><b>${esc(c.name)}</b>${c.address?`<div>${esc(c.address)}</div>`:''}${c.hours?`<div>${esc(c.hours)}</div>`:''}${c.phone?`<div><a href="tel:+${c.phone}">${esc(c.phone)}</a></div>`:''}${c.instagram?`<div><a href="${/^http/.test(c.instagram)?esc(c.instagram):'https://instagram.com/'+esc(c.instagram.replace('@',''))}" target="_blank" rel="noopener">Instagram</a></div>`:''}<p class="mu">© ${new Date().getFullYear()} ${esc(c.name)} · <a data-l href="/admin">Área da loja</a></p></div></footer>`}
const vazio=()=>`<div class="em"><b>Estamos atualizando o estoque.</b><span>Enquanto isso, fale com a loja no WhatsApp.</span>${S.cfg.whatsapp?`<a class="b g" href="${wa(S.cfg)}" target="_blank" rel="noopener">Falar no WhatsApp</a>`:''}</div>`;
/* páginas públicas */
function home(){const c=S.cfg,d=pub(),dest=d.filter(v=>v.featured).slice(0,6),map=c.address?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.address)}`:'';
 return`<section class="hero"><div class="c"><h1>${esc(c.name)}</h1><p class="lead">${esc(c.tagline)}</p><form class="pn" data-f="hq"><h2 class="full">Encontre seu próximo veículo</h2>${sel('marca','Marca',uq('brand'),'')}${sel('preco','Preço até',precos(),'')}${sel('ano','Ano a partir de',anos(),'')}${sel('cat','Categoria',c.categories,'','Todas')}<button class="b p full" id="hc">${cnt(d.length)}</button></form></div><div class="rule"></div></section>`
 +(d.length?'':`<div class="c sc">${vazio()}</div>`)
 +(dest.length?`<section class="sc"><div class="c"><h2>Em destaque</h2>${grid(dest)}<p><a data-l href="/estoque">Ver todo o estoque</a></p></div></section>`:'')
 +(d.length?`<section class="sc"><div class="c"><h2>Recém-chegados</h2><p class="mu">Cadastrados nos últimos 14 dias</p>${grid(rec(d.filter(v=>new Date()-new Date(v.createdAt)<12096e5)).slice(0,6))||''}</div></section>`.replace(/<section class="sc"><div class="c"><h2>Recém-chegados<\/h2><p class="mu">[^<]*<\/p><div class="grid"><\/div><\/div><\/section>/,''):'')
 +(c.differentials?.length?`<section class="sc"><div class="c"><h2>Por que escolher a ${esc(c.name)}</h2><ul class="chips">${c.differentials.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></section>`:'')
 +(c.address||c.hours||c.whatsapp||c.phone?`<section class="sc"><div class="c"><h2>Onde estamos</h2>${c.address?`<p>${esc(c.address)}</p>`:''}${c.hours?`<p>${esc(c.hours)}</p>`:''}<div class="acts">${map?`<a class="b" href="${map}" target="_blank" rel="noopener">Como chegar</a>`:''}${c.whatsapp?`<a class="b g" href="${wa(c)}" target="_blank" rel="noopener">Falar no WhatsApp</a>`:''}${c.phone?`<a class="b" href="tel:+${c.phone}">Ligar</a>`:''}</div></div></section>`:'')}
function est(){const q=Qs();document.title='Estoque · '+S.cfg.name;
 return`<div class="c sc"><h1>Estoque</h1><p class="mu" id="cnt"></p><form class="fl" data-f="x"><label>Buscar<input type="search" data-flt="q" value="${esc(q.q)}" placeholder="Buscar por marca ou modelo"></label>${sel('marca','Marca',uq('brand'),q.marca)}${sel('cat','Categoria',S.cfg.categories,q.cat,'Todas')}${sel('preco','Preço até',precos(),q.preco)}${sel('ano','Ano a partir de',anos(),q.ano)}${sel('comb','Combustível',uq('fuel'),q.comb)}${sel('cam','Câmbio',uq('transmission'),q.cam)}${sel('ord','Ordenar',[['pa','Menor preço'],['pd','Maior preço'],['km','Menor km'],['ano','Mais novos']],q.ord,'Mais recentes')}</form><div id="res" aria-live="polite"></div></div>`}
function res(){const el=$('#res');if(!el)return;const r=flt(Qs());$('#cnt').textContent=r.length+(r.length==1?' veículo':' veículos');
 el.innerHTML=!pub().length?vazio():r.length?grid(r.slice(0,S.lim))+(r.length>S.lim?`<p class="tc"><button class="b" data-a="more">Ver mais 12</button> <small class="mu">Mostrando ${S.lim} de ${r.length}</small></p>`:''):`<div class="em"><b>Nenhum veículo com esses filtros.</b><span>Tente ampliar a busca ou limpar os filtros.</span><a class="b p" data-l href="/estoque">Limpar filtros</a></div>`}
act.more=()=>{S.lim+=12;res()};
function fic(sl){const v=S.v.find(x=>x.slug===sl);if(!v)return nf();const c=S.cfg,sold=v.status==='sold',rl=pub().filter(x=>x.id!==v.id&&(x.brand===v.brand||x.category===v.category)).slice(0,3),f=S.fav.includes(v.id);
 document.title=nm(v)+' '+v.yearModel+' · '+c.name;$('meta[name=description]').content=`${v.yearModel} · ${km(v.mileage)} · ${v.transmission} · ${v.fuel} · ${fm(v.price)}. Veja as fotos e fale com a loja.`;
 const msg=`Olá! Tenho interesse neste veículo:\n\n*${nm(v)} ${v.yearFab}/${v.yearModel}*\n${[fm(v.price),km(v.mileage),v.fuel,v.transmission,v.color].filter(Boolean).join(' · ')}\n${v.description?v.description.slice(0,200)+(v.description.length>200?'…':'')+'\n':''}\nLink: ${location.origin}/v/${v.slug}`;
 const cta=sold?`<div class="em"><b>Este veículo já foi vendido.</b><a class="b p" data-l href="/estoque">Ver veículos parecidos</a></div>`:c.whatsapp?`<a class="b g" href="${wa(c,msg)}" target="_blank" rel="noopener">${ic('chat')} Chamar no WhatsApp</a>`:'';
 return`<div class="c sc"><p class="mu"><a data-l href="/estoque">Estoque</a> › ${esc(v.brand)} › ${esc(v.model)}</p><div class="ficha"><div class="ga">${v.photos.length?`<div class="gal" id="gal" tabindex="0" aria-label="Fotos do veículo">${v.photos.map((p,i)=>`<img src="${ph(v,i,'f')}" alt="${esc(v.brand+' '+v.model+' '+v.yearModel)}, foto ${i+1}" width="1600" height="1200" ${i?'loading="lazy"':'fetchpriority="high"'}>`).join('')}</div><p class="sp mu tc" id="gc">1/${v.photos.length}</p>`:'<div class="np big">${np()}</div>'}</div><div class="side"><h1>${esc(nm(v))}</h1><span class="tag lg2">${esc(fm(v.price))}</span><div class="fc"><div><small>Ano</small><b>${v.yearFab}/${v.yearModel}</b></div><div><small>Quilometragem</small><b>${km(v.mileage)}</b></div><div><small>Câmbio</small><b>${esc(v.transmission)}</b></div><div><small>Combustível</small><b>${esc(v.fuel)}</b></div>${v.color?`<div><small>Cor</small><b>${esc(v.color)}</b></div>`:''}${v.category?`<div><small>Categoria</small><b>${esc(v.category)}</b></div>`:''}</div>${cta}<div class="acts">${c.phone?`<a class="b" href="tel:+${c.phone}">${ic('phone')} Ligar</a>`:''}<button class="b" data-a="share" data-s="${v.slug}">${ic('share')} Compartilhar</button><button class="b" data-a="fav" data-id="${v.id}" aria-pressed="${f}">${ic(f?'hf':'heart')} ${f?'Favorito ✓':'Favoritar'}</button></div></div><div class="ds">${v.description?`<h2>Sobre este veículo</h2><p style="white-space:pre-line">${esc(v.description)}</p>`:''}${v.options.length?`<h2>Opcionais</h2><ul class="chips">${v.options.map(o=>`<li>${esc(o)}</li>`).join('')}</ul>`:''}</div></div>
 ${rl.length?`<h2>Veículos parecidos</h2>${grid(rl)}`:''}</div>${!sold&&c.whatsapp?`<div class="bar"><b class="tag" style="position:static">${esc(fm(v.price))}</b><a class="b g" href="${wa(c,msg)}" target="_blank" rel="noopener">${ic('chat')} WhatsApp</a></div>`:''}`}
act.share=async b=>{const u=location.origin+'/v/'+b.dataset.s;try{if(navigator.share)await navigator.share({title:document.title,url:u});else{await navigator.clipboard.writeText(u);toast('Link copiado.')}}catch{}};
act.fav=b=>{const i=b.dataset.id,k=S.fav.indexOf(i);k<0?S.fav.push(i):S.fav.splice(k,1);ls.s('fav',JSON.stringify(S.fav));toast(k<0?'Adicionado aos favoritos.':'Removido dos favoritos.');const y=scrollY;draw();scrollTo(0,y)};
function favs(){const l=S.v.filter(v=>S.fav.includes(v.id));document.title='Favoritos · '+S.cfg.name;return`<div class="c sc"><h1>Favoritos</h1><p class="mu">Guardados neste aparelho. Se você trocar de celular ou limpar os dados do navegador, eles somem.</p>${l.length?grid(l):`<div class="em"><b>Você ainda não favoritou nenhum veículo.</b><span>Toque no coração de um veículo para guardá-lo aqui.</span><a class="b p" data-l href="/estoque">Ver estoque</a></div>`}</div>`}
const nf=()=>`<div class="c sc"><div class="em"><h1>Página não encontrada.</h1><span>O endereço pode ter mudado ou o veículo já não está disponível.</span><a class="b p" data-l href="/estoque">Ver estoque</a></div></div>`;
/* admin */
const ST={draft:'Rascunho',published:'Publicado',sold:'Vendido'};
const login=()=>`<form class="c sc nar" data-f="login"><h1>Área da loja</h1><label>Senha<input type="password" name="password" autocomplete="current-password" required></label><button class="b p">Entrar</button><a data-l href="/">Voltar ao site</a></form>`;
forms.login=async f=>{const d=await api('login',{method:'POST',json:{password:f.password.value}});S.tk=d.token;try{sessionStorage.setItem('tk',d.token)}catch{}draw()};
act.out=()=>{S.tk=null;S.adm=null;try{sessionStorage.removeItem('tk')}catch{}draw()};
act.tab=b=>{S.tab=b.dataset.t;S.ed=null;av()};
async function loadAdm(){if(!S.adm){try{S.adm=await api('admin/catalog')}catch(e){toast(e.m);return}}av()}
function av(){const el=$('#ad');if(!el)return;const t=S.tab;el.innerHTML=`<div class="tb"><h1>Área da loja</h1><span><a data-l href="/">Ver site</a> · <button class="lk" data-a="out">Sair</button></span></div><div class="tabs"><button data-a="tab" data-t="v" aria-current="${t==='v'}">Veículos</button><button data-a="tab" data-t="l" aria-current="${t==='l'}">Loja</button></div>`+(t==='l'?lojaF():S.ed?vf():vl())}
function vl(){const a=S.adm.vehicles;return`<p><button class="b p" data-a="new">Novo veículo</button></p>`+(a.length?a.map(v=>`<div class="row">${v.photos[0]?`<img src="${ph(v)}" alt="">`:'<div class="np">—</div>'}<div><b>${esc(nm(v))} ${v.yearModel}</b><div class="mu sp">${fm(v.price)} · ${ST[v.status]}${v.featured?' · Destaque':''}</div></div><div class="ac" data-id="${v.id}"><button data-a="op" data-o="ed">Editar</button><button data-a="op" data-o="feat">${v.featured?'Remover destaque':'Destacar'}</button><button data-a="op" data-o="sold">${v.status==='sold'?'Voltar ao estoque':'Marcar como vendido'}</button><button data-a="op" data-o="pub">${v.status==='published'?'Despublicar':'Publicar'}</button><button data-a="op" data-o="del">Excluir</button></div></div>`).join(''):`<div class="em"><b>Nenhum veículo cadastrado.</b><span>Comece cadastrando o primeiro.</span></div>`)}
async function sv(v){const d=await api('admin/vehicle',{method:'PUT',json:{vehicle:v,rev:S.adm.rev}});S.adm.rev=d.rev;const i=S.adm.vehicles.findIndex(x=>x.id===d.vehicle.id);i<0?S.adm.vehicles.unshift(d.vehicle):S.adm.vehicles[i]=d.vehicle;return d.vehicle}
act.new=()=>{S.ed={id:crypto.randomUUID(),brand:'',model:'',version:'',yearFab:'',yearModel:'',price:'',mileage:'',fuel:'Flex',transmission:'Manual',color:'',category:'',description:'',options:[],featured:false,status:'draft',photos:[]};S.ph=[];av()};
act.op=async b=>{const id=b.parentNode.dataset.id,v=S.adm.vehicles.find(x=>x.id===id),o=b.dataset.o;try{
 if(o==='ed'){S.ed=structuredClone(v);S.ph=[...v.photos];return av()}
 if(o==='del'){if(!confirm('Excluir este veículo? O veículo e suas fotos serão apagados. Esta ação não pode ser desfeita.'))return;const d=await api('admin/vehicle/'+id,{method:'DELETE'});S.adm.rev=d.rev;S.adm.vehicles=S.adm.vehicles.filter(x=>x.id!==id);toast('Veículo excluído.');return av()}
 const n={...v};if(o==='feat'){if(v.status!=='published')return toast('Publique o veículo para poder destacá-lo.');n.featured=!v.featured}
 if(o==='sold')n.status=v.status==='sold'?'published':'sold';if(o==='pub')n.status=v.status==='published'?'draft':'published';
 await sv(n);toast('Alterações salvas.');av()}catch(x){toast(x.m||'Algo deu errado do nosso lado. Tente novamente em instantes.');if(x.s===409){S.adm=null;draw()}}};
const opt=(a,v)=>a.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join(''),inp=(l,n,v,x='')=>`<label>${l}<input name="${n}" value="${esc(v)}" ${x}></label>`;
function vf(){const e=S.ed,cats=(S.adm.settings.categories||DEF.categories);
 return`<form class="fm" data-f="v"><h2>${S.adm.vehicles.some(x=>x.id===e.id)?'Editar veículo':'Novo veículo'}</h2><div><b>Fotos (<span id="pn">${S.ph.length}</span> de 12)</b><p class="mu">A primeira foto é a capa. Comece por uma foto da frente em 3/4.</p><div class="pt" id="pl"></div><label>Adicionar fotos<input type="file" id="up" accept="image/*" multiple></label></div>
 ${inp('Marca','brand',e.brand,'required maxlength=40 placeholder="Ex.: Honda"')}${inp('Modelo','model',e.model,'required maxlength=60 placeholder="Ex.: Civic"')}${inp('Versão (opcional)','version',e.version,'maxlength=60 placeholder="Ex.: Touring 1.5"')}
 <div class="two">${inp('Ano de fabricação','yearFab',e.yearFab,'required inputmode=numeric')}${inp('Ano do modelo','yearModel',e.yearModel,'required inputmode=numeric')}</div>
 <div class="two">${inp('Preço (R$)','price',e.price,'inputmode=numeric placeholder="Vazio ou 0 = Consulte o valor"')}${inp('Quilometragem (km)','mileage',e.mileage,'required inputmode=numeric')}</div>
 <div class="two"><label>Combustível<select name="fuel">${opt(['Flex','Gasolina','Diesel','Etanol','Elétrico','Híbrido'],e.fuel)}</select></label><label>Câmbio<select name="transmission">${opt(['Manual','Automático','Automatizado','CVT'],e.transmission)}</select></label></div>
 <div class="two">${inp('Cor (opcional)','color',e.color,'maxlength=30')}<label>Categoria<select name="category"><option value="">Selecione</option>${opt(cats,e.category)}</select></label></div>
 <label>Descrição<textarea name="description" rows="5" maxlength="2000" placeholder="Conte o estado do veículo, revisões e o que for importante. Use só informações verdadeiras.">${esc(e.description)}</textarea></label>
 ${inp('Opcionais (separe por vírgula)','options',e.options.join(', '))}
 <label><span><input type="checkbox" name="featured" ${e.featured?'checked':''} style="width:auto;min-height:0"> Mostrar em destaque na Home</span></label><label><span><input type="checkbox" name="sold" ${e.status==='sold'?'checked':''} style="width:auto;min-height:0"> Marcar como vendido</span></label>
 <div class="acts"><button class="b" name="st" value="draft">Salvar rascunho</button><button class="b p" name="st" value="published">Publicar</button><button class="b" type="button" data-a="cancel">Cancelar</button></div></form>`}
act.cancel=()=>{S.ed=null;av()};
function phs(){const l=$('#pl');if(!l)return;$('#pn').textContent=S.ph.length;l.innerHTML=S.ph.map((p,i)=>`<div><img src="/api/photo/${S.ed.id}/${p.id}/t" alt="Foto ${i+1}">${i?'':'<small>Capa</small>'}<span class="x"><button type="button" data-a="pm" data-i="${i}" data-d="-1" aria-label="Mover para antes">◀</button><button type="button" data-a="pm" data-i="${i}" data-d="1" aria-label="Mover para depois">▶</button><button type="button" data-a="pm" data-i="${i}" data-d="0" aria-label="Remover foto">✕</button></span></div>`).join('')}
act.pm=b=>{const i=+b.dataset.i,d=+b.dataset.d,a=S.ph;if(!d)a.splice(i,1);else{const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]}phs()};
async function shrink(file,max){const b=await createImageBitmap(file,{imageOrientation:'from-image'}),k=Math.min(1,max/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);
 return new Promise(r=>c.toBlob(x=>x&&x.type==='image/webp'?r(x):c.toBlob(r,'image/jpeg',.82),'image/webp',.8))}
const put=(path,b)=>api(path,{method:'POST',body:b,headers:{'content-type':b.type}});
document.addEventListener('change',async e=>{const t=e.target;if(t.id!=='up')return;const fs=[...t.files];t.value='';
 for(let i=0;i<fs.length;i++){if(S.ph.length>=12){toast('O limite é de 12 fotos por veículo.');break}toast(`Enviando foto ${i+1} de ${fs.length}…`);
  try{const id=crypto.randomUUID();await put(`admin/photo/${S.ed.id}/${id}/f`,await shrink(fs[i],1600));await put(`admin/photo/${S.ed.id}/${id}/t`,await shrink(fs[i],640));S.ph.push({id});phs()}catch(x){toast(x.m||'Use uma imagem JPG, PNG ou WebP.')}}toast('Fotos enviadas.')});
forms.v=async(f,ev)=>{const d=new FormData(f),st=d.get('sold')?'sold':ev.submitter?.value||'draft';
 const v={id:S.ed.id,brand:d.get('brand'),model:d.get('model'),version:d.get('version'),yearFab:d.get('yearFab'),yearModel:d.get('yearModel'),price:d.get('price'),mileage:d.get('mileage'),fuel:d.get('fuel'),transmission:d.get('transmission'),color:d.get('color'),category:d.get('category'),description:d.get('description'),options:d.get('options').split(',').map(x=>x.trim()).filter(Boolean),featured:!!d.get('featured'),status:st,photos:S.ph};
 await sv(v);toast(st==='published'?'Veículo publicado.':st==='sold'?'Veículo marcado como vendido.':'Rascunho salvo.');S.ed=null;av()};
function lojaF(){const c={...DEF,...S.adm.settings};
 return`<form class="fm" data-f="loja"><h2>Loja</h2>${inp('Nome da loja','name',c.name,'required maxlength=60')}${inp('Frase da Home','tagline',c.tagline,'maxlength=120')}<label>Logo (PNG, SVG ou WebP com fundo transparente)<input type="file" id="lg" accept="image/png,image/webp,image/jpeg"></label>
 <div class="two"><label>Cor de destaque<input type="color" name="accent" value="${esc(c.accent)}"></label><label>Cantos<select name="corners"><option value="suave"${c.corners!=='reto'?' selected':''}>Suaves</option><option value="reto"${c.corners==='reto'?' selected':''}>Retos</option></select></label></div>
 ${inp('WhatsApp (com DDD, só números; ex.: 11 99999-9999)','whatsapp',c.whatsapp||'','inputmode=tel')}${inp('Telefone (opcional)','phone',c.phone||'','inputmode=tel')}${inp('Endereço','address',c.address||'')}${inp('Horário de atendimento','hours',c.hours||'')}${inp('Instagram (usuário ou link)','instagram',c.instagram||'')}
 <label>Diferenciais (um por linha; só aparecem na Home se preencher)<textarea name="differentials" rows="4" placeholder="Ex.: Escreva aqui algo que seja verdade sobre a sua loja">${esc((c.differentials||[]).join('\n'))}</textarea></label>
 <label>Categorias (uma por linha)<textarea name="categories" rows="5">${esc((c.categories||DEF.categories).join('\n'))}</textarea></label><button class="b p">Salvar dados da loja</button></form>`}
forms.loja=async f=>{const d=new FormData(f),ln=k=>d.get(k).split('\n').map(x=>x.trim()).filter(Boolean);let logo=S.adm.settings.logo||0;const lg=$('#lg').files[0];
 if(lg){await put('admin/photo/s/logo/f',await shrink(lg,400));logo=Date.now()}
 const s=await api('admin/settings',{method:'PUT',json:{name:d.get('name'),tagline:d.get('tagline'),accent:d.get('accent'),corners:d.get('corners'),whatsapp:d.get('whatsapp'),phone:d.get('phone'),address:d.get('address'),hours:d.get('hours'),instagram:d.get('instagram'),differentials:ln('differentials'),categories:ln('categories'),logo}});
 S.adm.settings=s;S.cfg={...DEF,...s};theme();toast('Dados da loja salvos.');draw()};
/* desenho */
function draw(){const p=location.pathname,m=p.match(/^\/veiculo\/([^/]+)/);document.title=S.cfg.name+' · Veículos';
 let b;if(p.startsWith('/admin')){document.title='Área da loja · '+S.cfg.name;b=S.tk?'<div class="c" id="ad"></div>':login()}
 else if(S.st==='load')b='<div class="c sc"><div class="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></div>';
 else if(S.st==='err')b='<div class="c sc"><div class="em"><b>Não foi possível carregar o estoque.</b><span>Verifique sua internet e tente de novo.</span><button class="b p" data-a="retry">Tentar de novo</button></div></div>';
 else b=p==='/'?home():p==='/estoque'?est():m?fic(m[1]):p==='/favoritos'?favs():nf();
 app.innerHTML='<a class="skip" href="#m">Ir para o conteúdo</a>'+head()+'<main id="m" tabindex="-1">'+b+'</main>'+foot();
 if(p==='/estoque'&&S.st==='ok')res();if(p.startsWith('/admin')&&S.tk)loadAdm();
 const g=$('#gal');g&&g.addEventListener('scroll',()=>{$('#gc').textContent=(Math.round(g.scrollLeft/g.clientWidth)+1)+'/'+g.children.length},{passive:true})}
act.retry=()=>boot();
async function boot(){S.st='load';theme();draw();try{const d=await api('catalog');S.v=d.vehicles;S.cfg={...DEF,...d.settings};S.st='ok'}catch{S.st='err'}theme();draw()}
boot();
</script>
</body>
</html>
